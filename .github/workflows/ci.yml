name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: DIAG (temporary)
        run: |
          echo "=== 出网探测 ==="
          for u in \
            "https://maven.aliyun.com/repository/central/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.0-1.0.21/com.google.devtools.ksp.gradle.plugin-2.0.0-1.0.21.pom" \
            "https://maven.aliyun.com/repository/gradle-plugin/com/google/devtools/ksp/symbol-processing-gradle-plugin/2.0.0-1.0.21/symbol-processing-gradle-plugin-2.0.0-1.0.21.jar" \
            "https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.0-1.0.21/com.google.devtools.ksp.gradle.plugin-2.0.0-1.0.21.pom" \
            "https://repo.maven.apache.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.0-1.0.21/com.google.devtools.ksp.gradle.plugin-2.0.0-1.0.21.pom" ; do
            echo "PROBE $u -> $(curl -sSL -o /dev/null -w '%{http_code} %{size_download}B %{url_effective}' --max-time 40 "$u" 2>&1)"
          done
          echo "=== gradle --info 解析过程 ==="
          ./gradlew help --info --stacktrace 2>&1 | grep -iE "ksp|Resource missing|Could not GET|Could not HEAD|Cache miss|Failed to (get|resolve)" | head -40 || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check README version matches versionName
        # README 的版本号是硬编码的，校验脚本防止发版时漏改三语 README
        run: bash scripts/check-version.sh

      - name: Run unit tests
        # 金额解析、密码盐编解码、CSV 往返都属于"错了会静默丢数据"的纯函数，
        # 必须在每次提交时验证
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore
